global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/student_api_alerts.yml

scrape_configs:
  - job_name: "student-result-api"
    # Practical 12 requires the public Render hostname here.
    # Replace this placeholder with the real service hostname (no https:// prefix).
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - "REPLACE_WITH_YOUR_RENDER_HOST.onrender.com"
