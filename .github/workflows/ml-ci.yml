name: Student Result ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/anilkumargouthakatla-cmd/student-result-prediction

jobs:
  train-test-containerize-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run ML pipeline tests
        run: python -m unittest test_ml_pipeline -v

      - name: Run prediction application tests
        run: python -m unittest test_app -v

      - name: Build Docker image
        run: docker build -t student-result-prediction:latest -t student-result-prediction:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-ml-container \
            -p 5000:5000 \
            student-result-prediction:latest

      - name: Wait for application health
        shell: bash
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          echo "Application did not become healthy."
          docker logs student-result-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction":"PASS"'

      - name: Show Docker container logs
        if: always()
        run: docker logs student-result-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f student-result-ml-container || true

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp student_result_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Student Result Prediction ML Application\nRun: python app.py\nHealth: GET /health\nPrediction: POST /predict\nDocker image is built and runtime-tested in GitHub Actions.\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag validated image for GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag student-result-prediction:latest ${IMAGE_NAME}:v1
          docker tag student-result-prediction:latest ${IMAGE_NAME}:latest
          docker tag student-result-prediction:latest ${IMAGE_NAME}:${{ github.sha }}

      - name: Push validated image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${IMAGE_NAME}:v1
          docker push ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${{ github.sha }}

      - name: Pull published GHCR image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker pull ${IMAGE_NAME}:v1

      - name: Run container from published GHCR image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker run -d \
            --name student-result-ghcr-check \
            -p 5001:5000 \
            ${IMAGE_NAME}:v1

      - name: Verify published image health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5001/health; then
              echo "Published GHCR image is healthy."
              exit 0
            fi
            echo "Waiting for published image... attempt $i"
            sleep 2
          done
          docker logs student-result-ghcr-check
          exit 1

      - name: Verify prediction from published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5001/predict)
          echo "GHCR prediction response: $response"
          echo "$response" | grep -q '"prediction":"PASS"'

      - name: Clean up GHCR verification container
        if: always()
        run: docker rm -f student-result-ghcr-check || true
