name: Student Result Prediction CI - Practical 12 Monitoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: student-result-prediction

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Train existing project model for CI test fixture
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run ML pipeline tests
        run: python -m unittest test_ml_pipeline -v

      - name: Run prediction application tests
        run: python -m unittest test_app -v

      - name: Verify Prometheus metrics endpoint
        run: |
          python - <<'PY'
          from app import app
          client = app.test_client()
          health = client.get("/health")
          assert health.status_code == 200, health.data
          metrics = client.get("/metrics")
          assert metrics.status_code == 200, metrics.status_code
          body = metrics.get_data(as_text=True)
          for metric in (
              "student_api_http_requests_total",
              "student_api_http_request_duration_seconds",
              "student_api_predictions_total",
              "student_api_model_loaded",
          ):
              assert metric in body, f"Missing metric: {metric}"
          print("Health and Prometheus metrics checks passed.")
          PY

      - name: Build Docker image
        run: |
          IMAGE_ID="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
          IMAGE_ID="$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
          docker build -t student-result-prediction:ci -t student-result-prediction:${GITHUB_SHA} .

      - name: Start test container
        run: |
          docker run -d --name student-result-ci -p 5000:5000 student-result-prediction:ci

      - name: Test health, prediction, and metrics endpoints
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:5000/health >/dev/null; then
              break
            fi
            echo "Waiting for API, attempt $attempt"
            sleep 2
          done
          curl --fail --show-error http://localhost:5000/health
          curl --fail --show-error http://localhost:5000/metrics | grep -q "student_api_model_loaded"
          response=$(curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction":"PASS"'
          curl --fail --silent http://localhost:5000/metrics | grep -q 'student_api_predictions_total{result="success"}'

      - name: Show container logs
        if: always()
        run: docker logs student-result-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f student-result-ci || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Tag and publish tested image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag student-result-prediction:ci "$IMAGE_ID:latest"
          docker tag student-result-prediction:ci "$IMAGE_ID:sha-${GITHUB_SHA}"
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:sha-${GITHUB_SHA}"

      - name: Upload release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: student-result-practical-12-monitoring
          path: |
            app.py
            requirements.txt
            Dockerfile
            .github/workflows/ml-ci.yml
          if-no-files-found: error
          retention-days: 7
